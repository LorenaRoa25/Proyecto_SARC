<!-- Vista Login: formulario de ingreso al sistema académico -->
<div class="browser-frame fade-in">
  <div class="frame-body">
    <!-- Header de enlaces institucionales -->
    <div class="auth-headerbar">
      <div class="auth-headerbar-left">Apoyo académico</div>
      <div class="auth-headerbar-right">
        <span>Enlaces Externos</span>
        <a href="https://unisabaneta.edu.co/" target="_blank" rel="noreferrer">Unisabaneta</a>
        <a href="#" data-static-link="caequinos">Caequinos</a>
        <a href="#" data-static-link="pqrsf">PQRSF</a>
      </div>
    </div>

    <!-- Formulario principal de acceso -->
    <div class="auth-main">
      <div class="login-card">
        <div class="login-header">
          <div class="login-logo">
            <div class="login-logo-badge">S</div>
          </div>
          <h1 class="login-title">Sistema de apoyo académico</h1>
        </div>

        <form id="loginForm" autocomplete="off" novalidate>
          <div class="auth-field">
            <input class="auth-input" id="loginEmail" type="email" placeholder="Correo institucional" autocomplete="off" aria-label="Correo institucional">
          </div>
          <div class="auth-field password-field">
            <input class="auth-input" id="loginPassword" type="password" placeholder="Contraseña" autocomplete="new-password" aria-label="Contraseña">
            <button class="password-toggle" id="togglePassword" type="button" aria-label="Mostrar contrasena" title="Mostrar contrasena">
              <span class="eye-icon" aria-hidden="true"></span>
            </button>
          </div>
          <div class="habeas-data-field">
            <label class="habeas-checkbox">
              <input type="checkbox" id="habeasDataCheck">
              <span>Acepto el tratamiento de mis datos personales de acuerdo con la <a href="#" id="showHabeasModal">política de privacidad</a> y términos institucionales</span>
            </label>
          </div>
          <button class="auth-button" id="loginSubmitBtn" type="submit" disabled>INGRESAR</button>
          <a href="#recuperar" class="auth-link" id="loginRecoverLink">Recuperar contraseña</a>
        </form>
      </div>
    </div>

    <!-- Footer institucional -->
    <footer class="frame-footer">
      <strong>Enlaces Externos</strong>
      <a href="https://unisabaneta.edu.co/" target="_blank" rel="noreferrer">Unisabaneta</a>
      <a href="#" data-static-link="pqrsf">PQRSF</a>
      <a href="#" data-static-link="caequinos">Caequinos</a>
      <div class="footer-icons">
        <span class="footer-icon">IG</span>
        <span class="footer-icon">F</span>
        <span class="footer-icon">T</span>
      </div>
    </footer>
  </div>
</div>
