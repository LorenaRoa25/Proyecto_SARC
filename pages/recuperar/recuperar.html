<!-- Vista Recuperar: formulario para actualizar la contraseña demo -->
<div class="browser-frame fade-in">
  <div class="frame-body">
    <!-- Header de enlaces institucionales -->
    <div class="auth-headerbar">
      <div class="auth-headerbar-left">Apoyo académico</div>
      <div class="auth-headerbar-right">
        <span>Enlaces Externos</span>
        <a href="https://unisabaneta.edu.co/" target="_blank" rel="noreferrer">Unisabaneta</a>
        <a href="#" data-static-link="caequinos">Caequinos</a>
        <a href="#" data-static-link="pqrsf">PQRSF</a>
      </div>
    </div>

    <!-- Formulario de recuperación -->
    <div class="auth-main">
      <div class="recovery-card">
        <div class="login-header">
          <div class="login-logo">
            <div class="login-logo-badge">S</div>
          </div>
          <h1 class="login-title">Recuperar contraseña</h1>
        </div>

        <form id="recoveryForm">
          <div class="auth-field">
            <input class="auth-input" id="recoveryEmail" type="email" value="{{email}}" aria-label="Correo institucional">
          </div>
          <div class="auth-field">
            <input class="auth-input" id="newPassword" type="password" placeholder="Nueva contraseña" aria-label="Nueva contraseña">
          </div>
          <div class="auth-field">
            <input class="auth-input" id="confirmPassword" type="password" placeholder="Confirmar contraseña" aria-label="Confirmar contraseña">
          </div>
          <div class="recovery-actions">
            <button class="mock-btn blue" id="recoverBackButton" type="button">Volver</button>
            <button class="mock-btn green" type="submit">Enviar</button>
          </div>
        </form>
      </div>
    </div>

    <!-- Footer institucional -->
    <footer class="frame-footer">
      <strong>Enlaces Externos</strong>
      <a href="https://unisabaneta.edu.co/" target="_blank" rel="noreferrer">Unisabaneta</a>
      <a href="#" data-static-link="pqrsf">PQRSF</a>
      <a href="#" data-static-link="caequinos">Caequinos</a>
      <div class="footer-icons">
        <span class="footer-icon">IG</span>
        <span class="footer-icon">F</span>
        <span class="footer-icon">T</span>
      </div>
    </footer>
  </div>
</div>
