<!-- Vista Inicio: bienvenida, cursos sugeridos, asistente virtual y recomendaciones dinámicas -->
<div class="green-banner left">Bienvenido, {{studentName}}</div>
<div class="home-grid fade-in">
  <!-- Cursos sugeridos principales -->
  <section class="home-left">
    <h2 class="section-title white">CURSOS SUGERIDOS</h2>
    <div class="simple-list">
      {{courseButtons}}
    </div>
  </section>

  <!-- Asistente virtual con recomendaciones dinámicas -->
  <section class="home-right">
    <h2 class="section-title">ASISTENTE VIRTUAL</h2>
    <div class="assistant-recommendations">
      {{assistantRecommendations}}
    </div>
  </section>
</div>
